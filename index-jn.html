<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>元智大学図書館ガイド</title>
  <link href="./css/style-home.css" rel="stylesheet" />
  <script src="./js/home.js" defer></script>
</head>
<body>
  <div class="container">
    <h1 class="intro-line">こんにちは、ゼーゼーです。元智大学図書館へようこそ。</h1>
    <p class="intro-line">
      この図書館のすべての場所、すべての本、そしてすべての設備には、それぞれの物語があります。<br>
      本日は、案内ルートに沿って、テクノロジー、人文、そして自然が融合したこの知の殿堂を一歩ずつ探検していきましょう。
    </p>

    <div id="choice-prompt" style="opacity:0;">
      <p>どのように進みますか？</p>
      <div class="button-group">
        <button data-show="free">自由探索</button>
        <button data-show="fixed">固定ルート</button>
        <button data-show="option">選択モード</button>
      </div>
    </div>

    <!-- 選択モード専用セクション（初期状態で非表示） -->
    <div id="option-mode" class="hidden">
      <h2>フロアを選択</h2>
      <div class="floor-buttons">
        <button class="floor-btn" data-floor="B1">B1</button>
        <button class="floor-btn" data-floor="1F">1F</button>
        <button class="floor-btn" data-floor="2F">2F</button>
      </div>

      <h2>エリアを選択</h2>
      <div id="area-selector">フロアを選択してください</div>
    </div>

  </div>
  <button id="end-tour-btn" class="hidden fixed-button">ガイドを終了する</button>
</body>
</html>
