  <div class="intro-text">
    <p class="intro-line">這裡，沒有水，卻能看見澎湃水流；沒有山，卻能感受高峰的沉穩——這就是圖書館深處的日式枯山水禪園。</p>
    <p class="intro-line">沙紋如水流，石景似山形，一切靜止，卻又在無聲中流動。站在這裡，思緒自然沉澱，內心也緩緩歸於平靜。</p>
    <p class="intro-line">正因這份靜謐深遠，校長廖慶榮也曾特別在此錄製影片，以此地象徵大學生累積內在能量的所在。</p>
    <p class="intro-line">讓這片園地不只是景觀，更是一段思考的起點。</p>
    <p class="intro-line">而最終站，我們即將抵達知識與自然的根源，是森林——但不是普通的森林，是一座有魔法的——魔法森林。</p>
