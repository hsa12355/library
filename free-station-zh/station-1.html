<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>第一站：智書網．電子書牆 - 文字導覽</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body id="option-mode-page">

<div class="container">

  <!-- 右上角樓層地圖按鈕 -->
  <button id="floor-map-btn" class="floor-map-btn">樓層地圖</button>

  <!-- 樓層地圖彈出層 -->
 <div id="floor-map-popup" class="floor-map-popup hidden">
  <!-- 新增樓層切換按鈕 -->
  <div class="floor-map-tabs">
    <button class="map-tab-btn" data-target="map-b1">B1</button>
    <button class="map-tab-btn" data-target="map-1f">1F</button>
    <button class="map-tab-btn" data-target="map-2f">2F</button>
  </div>

  <!-- 各樓層地圖 -->
  <div id="map-b1" class="floor-map-img">
    <img src="../images/Floor-B1s_-_.jpg" alt="樓層地圖B1" />
  </div>
  <div id="map-1f" class="floor-map-img hidden">
    <img src="../images/Floor-1Fs_-_.jpg" alt="樓層地圖1F" />
  </div>
  <div id="map-2f" class="floor-map-img hidden">
    <img src="../images/Floor-2Fs_-_.jpg" alt="樓層地圖2F" />
  </div>
    <button id="close-map" class="close-map">關閉地圖</button>
  </div>

  <!-- 介紹照片 -->
  <div id="slideshow-wrapper">
  <div id="slideshow-container">
    <h2 class="station-title">第一站：智書網．電子書牆 - 文字導覽</h2>
    <img id="slideshow-image" src="../images/1電子書牆/1-電子書牆01_吳志揚校長.png" alt="輪播圖片">
  </div>
</div>

<script>
  // 每頁定義自己的圖片清單（注意這是在 HTML 裡面定義的）
  window.slideshowImages = [
  '../images/1電子書牆/1-電子書牆01_吳志揚校長.png',
  '../images/1電子書牆/1-電子書牆01_徐董事長.png',
  '../images/1電子書牆/1-電子書牆03.jpg',
  '../images/1電子書牆/1-電子書牆04.jpg',
  '../images/1電子書牆/1-電子書牆05_買來西亞中學校長參訪團.jpg',
  '../images/1電子書牆/1-電子書牆06_中道中學參訪團.jpg',
  '../images/1電子書牆/1-電子書牆08_淡江高中參訪團.jpg',
  '../images/1電子書牆/1-電子書牆09.jpg',
  '../images/1電子書牆/1-電子書牆10.jpg'
  ];
</script>


  <!-- 介紹文字 -->
<div class="intro-text">
    <p class="intro-line">傳說中，在圖書館的一隅，藏著一面會「看人臉推薦書」的神奇書牆。</p>
    <p class="intro-line">沒錯，它就是2018年12月誕生的「電子書牆」！</p>
    <p class="intro-line">不僅具備主題式電子書推薦、QR Code 下載和「拍照推書」三大神技，它還非常熱情、主動、科技感滿滿！</p>
    <p class="intro-line">有人說它像是圖書界的 AI 丘比特，會用人臉辨識配對你的靈魂之書。開幕那天，連校長都被它圈粉，開心地拍了張照，拿到了一本《生活就像一本故事書》，一頭栽進了寒假閱讀之旅。</p>
    <p class="intro-line">下載、掃描、拍照、閱讀，在這裡，科技與閱讀談了一場高調的戀愛。而我們，也準備啟程，進入圖書館的深處，解鎖更多奇妙場景...</p>
  </div>

  <div id="choice-prompt">
  <!-- 樓層選擇按鈕 -->
  <div class="floor-selector">
    <button class="floor-btn" data-floor="B1">B1</button>
    <button class="floor-btn" data-floor="1F">1F</button>
    <button class="floor-btn" data-floor="2F">2F</button>
  </div>

  
  <!-- 區域選擇按鈕（動態生成） -->
  <div class="area-selector" id="area-selector"></div>
    <!-- 動態加入 -->
  </div>

  <!-- 右下角結束按鈕 -->
  <button id="end-tour-btn" class="end-tour-btn">結束導覽</button>

</div>

<script src="../js/text.js"></script>

</body>
</html>
