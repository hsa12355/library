<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第七站：現期期刊區．曬刊好福利</title>
  <link rel="stylesheet" href="../css/style-fixe.css" />
</head>
<body id="fixed-route">

<div class="container">

  <!-- 樓層地圖按鈕 -->
  <button id="floor-map-btn" class="floor-map-btn">樓層地圖</button>


  <!-- 樓層地圖彈窗 -->
 <div id="floor-map-popup" class="floor-map-popup hidden">
  <div class="floor-map-tabs">
    <button class="map-tab-btn active" data-target="map-b1">B1</button>
    <button class="map-tab-btn" data-target="map-1f">1F</button>
    <button class="map-tab-btn" data-target="map-2f">2F</button>
  </div>
  <img id="map-b1" class="floor-map-image" src="../images/Floor-B1s_-_.jpg" alt="樓層地圖B1">
  <img id="map-1f" class="floor-map-image hidden" src="../images/Floor-1Fs_-_.jpg" alt="樓層地圖1F">
  <img id="map-2f" class="floor-map-image hidden" src="../images/Floor-2Fs_-_.jpg" alt="樓層地圖2F">
  <button id="close-map" class="close-map">關閉地圖</button>
</div>


  <!-- 介紹圖片 -->
  <div id="slideshow-wrapper">
  <div id="slideshow-container">
    <h2 class="station-title">第七站：現期期刊區．曬刊好福利</h2>
    <img id="slideshow-image" src="../images/7期刊區/7-期刊區01.jpg" alt="輪播圖片">
  </div>
</div>
<script>
  // 每頁定義自己的圖片清單（注意這是在 HTML 裡面定義的）
  window.slideshowImages = [
  '../images/7期刊區/7-期刊區01.jpg',
  '../images/7期刊區/7-期刊區02.jpg',
  '../images/7期刊區/7-期刊區03.jpg'
  ];
</script>

  <!-- 介紹文字（動畫） -->
  <div class="intro-text">
    <p class="intro-line">歡迎來到期刊的主場——這裡彙集了最新的中西文期刊，從時事觀點到設計靈感，一字排開，宛如一場小型國際知識博覽會，等你來一探究竟。</p>
    <p class="intro-line">最讚的是每年舉辦的「曬刊活動」更是讀者的最愛：圖書館大方出清，讓你打包回家，冷門學術搖身一變，成為獨特居家擺設或創意拼貼素材，絕對文青、毫不浪費。</p>
    <p class="intro-line">雖然期刊限館內閱覽，但那種沉浸式閱讀的感覺，真的讓人捨不得離開。</p>
    <p class="intro-line">不過現在，是時候找回童年裡的那份溫柔與想像——你上次讀繪本是什麼時候？不如我們去找回童心吧。</p>
  </div>

  <!-- 導覽按鈕（左：上一站、右：下一站） -->
<nav class="station-nav">
  <a href="station-6.html" class="next-station-btn">上一站</a>
  <a href="station-8.html" class="next-station-btn" style="left: auto; right: 120px;">下一站</a>
</nav>


  <!-- 結束導覽按鈕 -->
  <button id="end-tour-btn" class="end-tour-btn">結束導覽</button>

</div>

<script src="../js/fixed.js"></script>
</body>
</html>
